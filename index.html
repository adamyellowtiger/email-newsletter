<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8" />
    <title>6 7 Motion Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f8ff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #container {
            position: relative;
            display: inline-block;
        }

        video, canvas {
            width: 640px;
            height: 480px;
            border-radius: 16px;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
        }

        #count {
            font-size: 48px;
            font-weight: bold;
            margin-top: 20px;
        }

        #status {
            font-size: 20px;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<h1>6 7 Motion Counter</h1>
<button id="startButton">Start Camera</button>

<div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>
</div>

<div id="count">Count: 0</div>
<div id="status">Waiting...</div>

<script type="module">
    import {
        PoseLandmarker,
        FilesetResolver,
        DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.getElementById("startButton");
    const countText = document.getElementById("count");
    const statusText = document.getElementById("status");

    let poseLandmarker;
    let drawingUtils;
    let count = 0;

    // Motion state:
    // 0 = waiting for right hand up
    // 1 = waiting for left hand up
    let stage = 0;

    let lastCountTime = 0;
    const cooldownMs = 600;

    const LEFT_SHOULDER = 11;
    const RIGHT_SHOULDER = 12;
    const LEFT_WRIST = 15;
    const RIGHT_WRIST = 16;

    async function createPoseLandmarker() {
        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numPoses: 1,
            minPoseDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        drawingUtils = new DrawingUtils(ctx);
    }

    async function startCamera() {
        await createPoseLandmarker();

        video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.addEventListener("loadeddata", predictWebcam);
        statusText.textContent = "Camera started. Do the 6 7 motion.";
    }

    function landmarkVisible(point) {
        return point && (point.visibility === undefined || point.visibility > 0.5);
    }

    function handIsUp(wrist, shoulder) {
        if (!landmarkVisible(wrist) || !landmarkVisible(shoulder)) {
            return false;
        }

        // In screen coordinates, smaller y means higher up.
        // The -0.05 margin prevents tiny movements from triggering.
        return wrist.y < shoulder.y - 0.05;
    }

    function detectSixSeven(landmarks) {
        const leftWrist = landmarks[LEFT_WRIST];
        const rightWrist = landmarks[RIGHT_WRIST];
        const leftShoulder = landmarks[LEFT_SHOULDER];
        const rightShoulder = landmarks[RIGHT_SHOULDER];

        const leftUp = handIsUp(leftWrist, leftShoulder);
        const rightUp = handIsUp(rightWrist, rightShoulder);

        const now = performance.now();

        if (stage === 0 && rightUp) {
            stage = 1;
            statusText.textContent = "Right hand detected. Now left hand.";
        }

        else if (stage === 1 && leftUp && now - lastCountTime > cooldownMs) {
            count++;
            countText.textContent = "Count: " + count;

            stage = 0;
            lastCountTime = now;
            statusText.textContent = "6 7 counted.";
        }
    }

    async function predictWebcam() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const results = poseLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks[0];

            drawingUtils.drawLandmarks(landmarks, {
                radius: 4
            });

            drawingUtils.drawConnectors(
                landmarks,
                PoseLandmarker.POSE_CONNECTIONS
            );

            detectSixSeven(landmarks);
        } else {
            statusText.textContent = "No body detected.";
        }

        requestAnimationFrame(predictWebcam);
    }

    startButton.addEventListener("click", startCamera);
</script>
</body>
</html>
